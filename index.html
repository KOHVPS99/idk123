<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangman - Tourism Services</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dff6ff, #fff7d6);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1f2937;
    }

    .game {
      width: 90%;
      max-width: 850px;
      background: white;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 36px;
    }

    .hint {
      background: #eef6ff;
      border-left: 6px solid #38bdf8;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 18px;
    }

    .main-area {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    svg {
      width: 230px;
      height: 280px;
      border-radius: 15px;
      background: #f8fafc;
      border: 2px solid #e5e7eb;
    }

    .part {
      display: none;
      stroke: #111827;
      stroke-width: 4;
      stroke-linecap: round;
      fill: none;
    }

    .show {
      display: block;
    }

    .word {
      font-size: 34px;
      letter-spacing: 8px;
      font-weight: bold;
      margin: 25px 0;
      min-height: 45px;
      word-spacing: 18px;
    }

    .letters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(45px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: white;
      transition: 0.2s;
    }

    button:hover:not(:disabled) {
      transform: scale(1.05);
      background: #1d4ed8;
    }

    button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      color: #64748b;
    }

    .status {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .wrong {
      color: #dc2626;
    }

    .win {
      color: #16a34a;
    }

    .reset {
      margin-top: 18px;
      background: #111827;
      width: 180px;
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>Hangman Game</h1>
    <div class="main-area">
      <svg viewBox="0 0 220 270">
        <!-- Gallows -->
        <line x1="30" y1="250" x2="180" y2="250" stroke="#111827" stroke-width="5" />
        <line x1="60" y1="250" x2="60" y2="25" stroke="#111827" stroke-width="5" />
        <line x1="60" y1="25" x2="155" y2="25" stroke="#111827" stroke-width="5" />
        <line x1="155" y1="25" x2="155" y2="55" stroke="#111827" stroke-width="4" />

        <!-- Body parts: 6 wrong guesses -->
        <circle id="part0" class="part" cx="155" cy="75" r="20" />
        <line id="part1" class="part" x1="155" y1="95" x2="155" y2="155" />
        <line id="part2" class="part" x1="155" y1="115" x2="125" y2="140" />
        <line id="part3" class="part" x1="155" y1="115" x2="185" y2="140" />
        <line id="part4" class="part" x1="155" y1="155" x2="130" y2="200" />
        <line id="part5" class="part" x1="155" y1="155" x2="180" y2="200" />
      </svg>

      <div>
        <div class="word" id="wordDisplay"></div>
        <div class="status" id="status">Choose a letter.</div>
      </div>
    </div>

    <div class="letters" id="letters"></div>
    <button class="reset" onclick="resetGame()">Restart Game</button>
  </div>

  <script>
    const phrase = "TOURISM SERVICES";
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    let guessedLetters = [];
    let wrongGuesses = 0;
    const maxWrong = 6;

    const wordDisplay = document.getElementById("wordDisplay");
    const lettersBox = document.getElementById("letters");
    const statusText = document.getElementById("status");

    function displayWord() {
      wordDisplay.textContent = phrase
        .split("")
        .map(char => {
          if (char === " ") return "  ";
          return guessedLetters.includes(char) ? char : "_";
        })
        .join(" ");
    }

    function createLetters() {
      lettersBox.innerHTML = "";
      alphabet.forEach(letter => {
        const btn = document.createElement("button");
        btn.textContent = letter;
        btn.onclick = () => guessLetter(letter, btn);
        lettersBox.appendChild(btn);
      });
    }

    function guessLetter(letter, button) {
      button.disabled = true;
      guessedLetters.push(letter);

      if (!phrase.includes(letter)) {
        document.getElementById("part" + wrongGuesses).classList.add("show");
        wrongGuesses++;
        statusText.textContent = `Wrong! Body parts lost: ${wrongGuesses}/${maxWrong}`;
        statusText.className = "status wrong";
      } else {
        statusText.textContent = "Correct letter!";
        statusText.className = "status win";
      }

      displayWord();
      checkGameEnd();
    }

    function checkGameEnd() {
      const allGuessed = phrase
        .split("")
        .every(char => char === " " || guessedLetters.includes(char));

      if (allGuessed) {
        statusText.textContent = "You won! The answer is TOURISM SERVICES.";
        statusText.className = "status win";
        disableAllLetters();
      }

      if (wrongGuesses >= maxWrong) {
        statusText.textContent = "Game over! The answer was TOURISM SERVICES.";
        statusText.className = "status wrong";
        disableAllLetters();
        revealAnswer();
      }
    }

    function disableAllLetters() {
      document.querySelectorAll(".letters button").forEach(btn => btn.disabled = true);
    }

    function revealAnswer() {
      wordDisplay.textContent = phrase;
    }

    function resetGame() {
      guessedLetters = [];
      wrongGuesses = 0;
      statusText.textContent = "Choose a letter.";
      statusText.className = "status";
      document.querySelectorAll(".part").forEach(part => part.classList.remove("show"));
      createLetters();
      displayWord();
    }

    createLetters();
    displayWord();
  </script>
</body>
</html>
